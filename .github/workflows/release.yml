name: Build and Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build:
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build app
              run: npm run package
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos-build
                  path: |
                      dist/*.dmg
                      dist/*.zip
                      dist/*.blockmap
                  if-no-files-found: ignore

    release:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts

            - name: Extract tag name
              id: tag
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: Release ${{ steps.tag.outputs.tag }}
                  body: |
                      ## YJ - Family Voices ${{ steps.tag.outputs.tag }}

                      macOS release with DMG and ZIP installers.

                      ### Installation
                      1. Download the DMG file
                      2. Open and drag YJ.app to Applications
                      3. Launch from Applications or Spotlight
                  files: |
                      release-artifacts/macos-build/*.dmg
                      release-artifacts/macos-build/*.zip
                      release-artifacts/macos-build/*.blockmap
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
